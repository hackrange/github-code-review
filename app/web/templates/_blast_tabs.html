{# The parts of the blast radius.  Access answers "who can reach what".

   becoming two unrelated pages in the sidebar. #}
<nav class="section-nav" aria-label="Blast radius">
  <a href="{{ base }}/blast-radius"

  <a href="{{ base }}/blast-radius/software"
     {% if blast_tab == 'software' %}style="color:var(--text);border-color:var(--border-strong)"{% endif %}>
    Software</a>
</nav>
