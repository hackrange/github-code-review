# Git Code Review: weekly fix plan
#
# Builds a to-do list for this repository: secrets to rotate, packages to
# upgrade, images to rebuild, build file problems, and code fixes an AI review
# suggested.  It appears on the run's summary page and as a download.
#
# It never fails the build because of findings.  It is advice.  It does warn
# when the token is about to expire.
name: Git Code Review fix plan

on:
  schedule:
    - cron: "0 13 * * 1"     # every Monday at 13:00 UTC
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  fix-plan:
    runs-on: ${{ vars.GCR_RUNNER || 'ubuntu-latest' }}
    env:
      GCR_URL: ${{ vars.GCR_URL }}
    steps:
      # The helper runs from the base branch, never from the pull request.
      # The plan is about the repository, not about the change, and code a
      # pull request brings must never run beside the token: it could read it
      # and send it anywhere.  A schedule or a manual run checks out the
      # default branch as before.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Check the token
        env:
          GCR_TOKEN: ${{ secrets.GCR_TOKEN }}
        run: python3 .github/gcr/python/gcr_api.py token-expiry --warn-days 14

      - name: Build the fix plan
        env:
          GCR_TOKEN: ${{ secrets.GCR_TOKEN }}
        run: python3 .github/gcr/python/gcr_api.py fix-plan --markdown fix-plan.md

      - name: Keep the plan as a download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: gcr-fix-plan
          path: fix-plan.md
