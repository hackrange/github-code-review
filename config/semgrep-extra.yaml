- id: gcr-saml-response-not-bound-js
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: InResponseTo is not checked, so a SAML response is accepted without being tied to a sign in
    this application started. A response captured once can be replayed into a new session, or posted
    into a victim's browser to sign them in as somebody else. Leave the check on and keep the request
    ids in a shared cache.
  metadata:
    cwe: 'CWE-294: Authentication Bypass by Capture-replay'
    category: security
    confidence: HIGH
  pattern-either:
  - pattern: '{..., validateInResponseTo: false, ...}'
  - pattern: '{..., validateInResponseTo: "never", ...}'
  - pattern: '{..., validateInResponseTo: ValidateInResponseTo.never, ...}'
- id: gcr-tls-verify-disabled-php
  languages:
  - php
  severity: WARNING
  message: Certificate checking is turned off for this connection, so anybody on the network path can
    pose as the server, read what is sent, and change what comes back. If one known host has a bad
    certificate, trust that certificate alone (CURLOPT_CAINFO or a pinned public key) rather than all
    of them.
  metadata:
    cwe: 'CWE-295: Improper Certificate Validation'
    category: security
    confidence: HIGH
  pattern-either:
  - pattern: 'curl_setopt($C, CURLOPT_SSL_VERIFYPEER, false)'
  - pattern: 'curl_setopt($C, CURLOPT_SSL_VERIFYPEER, 0)'
  - pattern: '[..., CURLOPT_SSL_VERIFYPEER => false, ...]'
  - pattern: '[..., CURLOPT_SSL_VERIFYPEER => 0, ...]'
  - pattern: '[..., "verify_peer" => false, ...]'
  - pattern: '[..., "verify" => false, ...]'
  # The host name check alone, where the certificate check was left on.  When
  # both are off the one finding above says it.
  - patterns:
    - pattern-either:
      - pattern: 'curl_setopt($C, CURLOPT_SSL_VERIFYHOST, false)'
      - pattern: 'curl_setopt($C, CURLOPT_SSL_VERIFYHOST, 0)'
    - pattern-not-inside: |
        curl_setopt($C, CURLOPT_SSL_VERIFYPEER, false);
        ...
    - pattern-not-inside: |
        curl_setopt($C, CURLOPT_SSL_VERIFYHOST, $H);
        ...
        curl_setopt($C, CURLOPT_SSL_VERIFYPEER, false);
    - pattern-not-inside: |
        curl_setopt($C, CURLOPT_SSL_VERIFYPEER, 0);
        ...
    - pattern-not-inside: |
        curl_setopt($C, CURLOPT_SSL_VERIFYHOST, $H);
        ...
        curl_setopt($C, CURLOPT_SSL_VERIFYPEER, 0);
  - patterns:
    - pattern-either:
      - pattern: '[..., CURLOPT_SSL_VERIFYHOST => false, ...]'
      - pattern: '[..., CURLOPT_SSL_VERIFYHOST => 0, ...]'
    - pattern-not: '[..., CURLOPT_SSL_VERIFYPEER => false, ...]'
    - pattern-not: '[..., CURLOPT_SSL_VERIFYPEER => 0, ...]'
  - patterns:
    - pattern: '[..., "verify_peer_name" => false, ...]'
    - pattern-not: '[..., "verify_peer" => false, ...]'
- id: gcr-check-then-fetch-unpinned-php
  languages:
  - php
  severity: WARNING
  message: The host is checked for a private address, then fetched by name, which looks the name up
    again. A name that answers with a public address for the check and a private one for the fetch
    (DNS rebinding) walks straight past the check. Resolve once, check that address, and hand it to
    curl with CURLOPT_RESOLVE so the connection goes to the address that was checked; check every
    redirect the same way.
  metadata:
    cwe: 'CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition'
    category: security
    confidence: MEDIUM
  patterns:
  - pattern-inside: |
      function $F(...) { ... }
  - pattern-either:
    - pattern-inside: |
        if (<... $CHECK(...) ...>) { ... }
        ...
    - pattern-inside: |
        if (<... $O->$CHECK(...) ...>) { ... }
        ...
    - pattern-inside: |
        if (<... self::$CHECK(...) ...>) { ... }
        ...
