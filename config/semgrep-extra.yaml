# Weaknesses the 2026 AI pen tests of a PHP application proved, in the shapes
# a pattern can decide on its own.  Each one is narrow on purpose: a safe
# version of the same code has to stay quiet.
- id: gcr-dompdf-php-enabled
  languages:
  - php
  severity: ERROR
  message: Dompdf is set to run PHP found inside the HTML it renders. Any text a user can get into
    the document, such as a company name or a note, can then carry a script tag of type text/php,
    and the server runs it while building the PDF. That is remote code execution, and it reaches
    the database and the network from inside the server. Leave isPhpEnabled off and build any
    page numbers or headers with Dompdf's canvas API instead.
  metadata:
    cwe: 'CWE-94: Improper Control of Generation of Code'
    category: security
    confidence: HIGH
  pattern-either:
  - pattern: $O->set_option('isPhpEnabled', true)
  - pattern: $O->set_option("isPhpEnabled", true)
  - pattern: $O->set('isPhpEnabled', true)
  - pattern: $O->set("isPhpEnabled", true)
  - pattern: $O->setIsPhpEnabled(true)
  - pattern: $O->set_option('enable_php', true)
  - pattern: $O->set_option("enable_php", true)
  - pattern: new Options([..., 'isPhpEnabled' => true, ...])
  - pattern: new Options([..., "isPhpEnabled" => true, ...])
  - pattern: new \Dompdf\Options([..., 'isPhpEnabled' => true, ...])
  - pattern: new Dompdf([..., 'isPhpEnabled' => true, ...])
  - pattern: new \Dompdf\Dompdf([..., 'isPhpEnabled' => true, ...])
  - pattern: define('DOMPDF_ENABLE_PHP', true)
  - pattern: define("DOMPDF_ENABLE_PHP", true)
- id: gcr-php-server-path-reflected
  languages:
  - php
  severity: WARNING
  mode: taint
  message: The page writes the request's own path or query string into its HTML (or a redirect)
    without encoding it. With a script that also accepts extra path after its name, a link like
    page.php/"><meta http-equiv=refresh content="0;url=https://attacker.example"> puts markup
    on the page, which sends the visitor anywhere or runs script. Encode it with htmlspecialchars,
    or use a fixed path such as the script's own name.
  metadata:
    cwe: 'CWE-79: Improper Neutralization of Input During Web Page Generation'
    category: security
    confidence: HIGH
  pattern-sources:
  - patterns:
    - pattern: $_SERVER[$K]
    - metavariable-regex:
        metavariable: $K
        regex: ^['"](PHP_SELF|REQUEST_URI|PATH_INFO|ORIG_PATH_INFO|QUERY_STRING|HTTP_REFERER)['"]$
  pattern-sanitizers:
  # Only plain string handling carries the path through.  Any other function or
  # method in between (an escaper, a router, a library building a URL) is
  # taken as deciding what comes out, so it does not report what it cannot see.
  - patterns:
    - pattern: $F(...)
    - metavariable-regex:
        metavariable: $F
        regex: ^(?!(trim|ltrim|rtrim|strtolower|strtoupper|str_replace|str_ireplace|sprintf|vsprintf|implode|join|urldecode|rawurldecode|substr|mb_substr|dirname|stripslashes|strval|preg_replace|ucfirst|nl2br|print|printf|header|echo)$)\$?[A-Za-z_\\][\w\\]*$
  - pattern: $O->$M(...)
  - pattern: $C::$M(...)
  pattern-sinks:
  - pattern: echo ...;
  - pattern: print(...)
  - pattern: printf(...)
  - patterns:
    - pattern: header($H, ...)
    - metavariable-regex:
        metavariable: $H
        regex: '(?i)^[''"](Location|Refresh)\s*:'
- id: gcr-csv-neutralizer-first-character-only
  languages:
  - php
  severity: WARNING
  message: This spreadsheet formula guard looks only at the very first character. A value that
    starts with a space, a tab or a line break before the = + - @ (or uses the full width forms
    ＝ ＋ － ＠) slips past it, and some spreadsheet programs still run it as a formula when the
    export is opened. Trim leading whitespace before the check, or match ^\s* in the pattern,
    and treat the full width forms the same way.
  metadata:
    cwe: 'CWE-1236: Improper Neutralization of Formula Elements in a CSV File'
    category: security
    confidence: MEDIUM
  patterns:
  - pattern-either:
    - patterns:
      - pattern: preg_match($RE, $V, ...)
      - metavariable-regex:
          metavariable: $RE
          regex: ^['"]([/#~])\^\[[^\]]*=[^\]]*\]
      - metavariable-regex:
          metavariable: $RE
          regex: ^(?!.*(\\s|\[:space:\]| \]|\\x20|\\t\]|＝)).*$
    - pattern: in_array($V[0], $LIST, ...)
    - pattern: in_array(substr($V, 0, 1), $LIST, ...)
    - pattern: in_array(mb_substr($V, 0, 1), $LIST, ...)
    - pattern: strpos($CHARS, $V[0]) !== false
    - pattern: strpbrk(substr($V, 0, 1), $CHARS)
  - pattern-not-inside: |
      function $F(...) {
        ...
        $V = ltrim(...);
        ...
      }
  - pattern-not-inside: |
      function $F(...) {
        ...
        $V = trim(...);
        ...
      }
  - pattern-not-inside: |
      function $F(...) {
        ...
        $V = preg_replace(...);
        ...
      }
  - pattern-inside: |
      function $F(...) {
        ...
      }
  - metavariable-regex:
      metavariable: $F
      regex: (?i).*(csv|cell|formula|spreadsheet|neutrali[sz]|export|excel|xls).*
- id: gcr-csv-neutralizer-first-character-only-python
  languages:
  - python
  severity: WARNING
  message: This spreadsheet formula guard looks only at the very first character. A value that
    starts with a space, a tab or a line break before the = + - @ (or uses the full width forms
    ＝ ＋ － ＠) slips past it, and some spreadsheet programs still run it as a formula when the
    export is opened. Check value.lstrip() instead, and treat the full width forms the same way.
  metadata:
