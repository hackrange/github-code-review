    category: security
    confidence: HIGH
  pattern-sources:
  - pattern: jwt.get_unverified_header(...)
  pattern-sinks:
  - patterns:
    - pattern-inside: jwt.decode(..., algorithms=$ALGS, ...)
    - focus-metavariable: $ALGS

