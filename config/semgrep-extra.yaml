    deny list), or refuse with 503 on the routes the check protects.
  metadata:
    cwe: 'CWE-636: Not Failing Securely (Failing Open)'
    category: security
    confidence: LOW
  patterns:
  - pattern-either:
    - pattern-inside: |
        def $F(...):
          ...
    - pattern-inside: |
        async def $F(...):
          ...
  - metavariable-regex:
      metavariable: $F
      regex: (?i)^_*(check\w*|dispatch|\w*throttl\w*|\w*rate_?limit\w*|\w*revok\w*|\w*(deny|block)_?list\w*|\w*locked\w*|\w*lockout\w*|is_ended|\w*signed_out\w*)$
  - pattern-either:
    - pattern-inside: |
        try:
          ...
        except Exception:
          ...
    - pattern-inside: |
        try:
          ...
        except Exception as $EX:
          ...
    - pattern-inside: |
        try:
          ...
        except:
          ...
  - pattern-not-inside: |
      try:
        ...
      except Exception:
        ...
        raise ...
  - pattern-not-inside: |
      try:
        ...
      except Exception as $EX:
        ...
        raise ...
  - pattern-not-inside: |
      try:
        ...
      except Exception:
        ...
        raise
  - pattern-not-inside: |
      try:
        ...
      except Exception as $EX:
        ...
        raise
  - pattern: $R.$M(...)
  - metavariable-regex:
      metavariable: $R
      regex: (?i).*(redis|memcache|valkey|\bcache\b)
  - metavariable-regex:
      metavariable: $M
      regex: ^(incr|incrby|exists|sismember|zcount|zcard|get|mget|hget|ttl)$
- id: gcr-symlink-check-then-follow-python
  languages:
  - python
  severity: WARNING
  message: The path is tested for a symlink and then changed by name with a call that follows symlinks.
    Whoever can write the parent directory can swap the entry for a link in between, and the owner or
    mode change lands on the link's target, anywhere a privileged process can reach. Open the directory
    once with O_NOFOLLOW, check it with fstat, and use fchown and fchmod on that descriptor, or pass
    follow_symlinks=False.
  metadata:
    cwe: 'CWE-367: Time-of-check Time-of-use (TOCTOU) Race Condition'
    category: security
    confidence: MEDIUM
  patterns:
  - pattern-either:
    - pattern: |
        if os.path.islink($P):
          ...
        ...
        os.$CALL($P, ...)
    - pattern: |
        if not os.path.islink($P):
          ...
          os.$CALL($P, ...)
  - metavariable-regex:
      metavariable: $CALL
      regex: ^(chown|chmod|lchmod|rename|replace|remove|unlink|rmdir)$
  - pattern-not: |
      if os.path.islink($P):
        ...
      ...
      os.$CALL($P, ..., follow_symlinks=False)
- id: gcr-upload-space-check-trusts-length
  languages:
  - python
  severity: WARNING
  message: >-
    Free disk space is checked against the Content-Length the client declared, and only when it
    declared one, but the body is then read as a stream that never looks at the disk again.  A
    chunked upload (no Content-Length) or several uploads at once skip the check and can fill the
    disk the server needs.  Check the space, or a quota for the folder, inside the loop against
    the bytes actually written, and cap how many uploads run at once.
  metadata:
    cwe: 'CWE-400: Uncontrolled Resource Consumption'
    category: security
    confidence: MEDIUM
  patterns:
  - pattern-either:
    - pattern-inside: |
        if $S and <... shutil.disk_usage(...) ...>:
          ...
        ...
    - pattern-inside: |
        if $S and <... $X.statvfs(...) ...>:
          ...
        ...
  - pattern: |
      async for $CH in $REQ.stream():
        ...
  - pattern-not: |
      async for $CH in $REQ.stream():
        ...
        <... shutil.disk_usage(...) ...>
        ...
  - pattern-not: |
      async for $CH in $REQ.stream():
        ...
        if <... shutil.disk_usage(...) ...>:
          ...
        ...
- id: gcr-presignin-session-key-left-behind
  languages:
  - python
  severity: WARNING
  message: >-
    A sign in step puts a pending user in the session and, only on some paths, another key beside
    it, and never clears that other key when a new attempt starts.  A second sign in in the same
    browser keeps the first attempt's key, so the next step can trust it for a different user (for
    example an enrollment secret that lets a password alone finish an account that already has a
    second factor).  Pop every pre sign in key at the start of the step, or keep them as one value
