# --- 2026-11-25: classes an outside review of a Python service found and no
# rule here matched.  Each is written for the pattern, not the repository that
# showed it: escaping skipped for values that look like markup, certificate
# checks off by default, an address blocklist that forgets the unspecified
# address, a revocation or rate check that lets requests through when its
# store errors, a symlink test followed by a chown or chmod that follows one,
# and a pipe splitter that treats the single quote as a string quote.
- id: gcr-escape-skipped-by-prefix
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: A value is escaped unless it starts with markup, and then it goes in as HTML. Anyone who can
    put that prefix at the start of the value (a profile field, a directory attribute, a record from
    another system) writes HTML into the page, and the script in it runs. Keep the trusted markup apart
    from the data, for example build the chip separately, and escape every data value.
  metadata:
    cwe: 'CWE-79: Improper Neutralization of Input During Web Page Generation'
    category: security
    confidence: MEDIUM
  patterns:
  - pattern-either:
    - pattern: '$X.startsWith($P) ? $X : $E($X)'
    - pattern: '$X.startsWith($P) ? $X : $O.$E($X)'
    - pattern: '$X.indexOf($P) === 0 ? $X : $E($X)'
    - pattern: '$X[0] === "<" ? $X : $E($X)'
  - metavariable-regex:
      metavariable: $P
      regex: ^['"`]\s*<
- id: gcr-escape-skipped-by-prefix-python
  languages:
  - python
  severity: WARNING
  message: A value is escaped unless it starts with markup, and then it goes in as HTML. Anyone who can
    put that prefix at the start of the value writes HTML into the page. Keep the trusted markup apart
    from the data and escape every data value.
  metadata:
    cwe: 'CWE-79: Improper Neutralization of Input During Web Page Generation'
    category: security
    confidence: MEDIUM
  patterns:
  - pattern-either:
    - pattern: '$X if $X.startswith($P) else $E($X)'
    - pattern: '$X if $X.startswith($P) else $O.$E($X)'
  - metavariable-regex:
      metavariable: $P
      regex: ^['"]\s*<
- id: gcr-tls-verify-off-by-default
  languages:
  - python
  severity: WARNING
  message: When nothing is configured, the connection falls back to a mode that does not check the
    server's certificate. Every install that never set the option sends its credentials to whoever
    answers on the network path. Default to checking the certificate, and let an administrator turn it
    off by name, or trust a named CA file instead.
  metadata:
    cwe: 'CWE-295: Improper Certificate Validation'
    category: security
    confidence: MEDIUM
  patterns:
  - pattern-either:
    - pattern: return "$V"
    - pattern: $D.get($K, "$V")
    - pattern: $A or "$V"
  - metavariable-regex:
      metavariable: $V
      regex: (?i)^[\w.-]*(no[_-]?verify|skip[_-]?verify|verify[_-]?(none|off|false)|insecure[_-]?skip[_-]?verify|(tls|ssl)[_-]?insecure|insecure[_-]?(tls|ssl))[\w.-]*$
