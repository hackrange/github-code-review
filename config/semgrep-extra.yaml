- id: gcr-exception-text-returned-python
  languages:
  - python
  severity: WARNING
  message: The text of an exception is sent back to the caller.  It can carry SQL, file paths, internal
    host names or secrets.  Log it, and send a generic message with a request id.
  metadata:
    cwe: 'CWE-209: Generation of Error Message Containing Sensitive Information'
    category: security
    confidence: MEDIUM
  patterns:
  - pattern-inside: |
      try:
          ...
      except $T as $E:
          ...
  # A ValueError the code raised itself with a sentence for the user is the
  # usual way to say what was wrong with the input.  Broad catches and errors
  # from the database, the disk or the network carry the internals.
  - metavariable-regex:
      metavariable: $T
      regex: ^(Exception|BaseException|\w*(SQL|Database|Operational|Integrity|Programming|DataError|OS|IO|Connection|Request|HTTP|Timeout|Subprocess|CalledProcess|Runtime)\w*(Error|Exception)?)$
  - pattern-either:
    - pattern: 'return {..., $K: str($E), ...}'
    - pattern: return jsonify(..., $K=str($E), ...)
    - pattern: 'return jsonify({..., $K: str($E), ...}, ...)'
    - pattern: 'return jsonify({..., $K: str($E), ...}), $CODE'
    - pattern: return jsonify(..., $K=str($E), ...), $CODE
    - pattern: 'return {..., $K: str($E), ...}, $CODE'
    - pattern: raise HTTPException(..., detail=str($E), ...)
    - pattern: 'return JSONResponse({..., $K: str($E), ...}, ...)'
    - pattern: return Response(str($E), ...)
    - pattern: 'return JsonResponse({..., $K: str($E), ...}, ...)'
    - pattern: return traceback.format_exc()
    - pattern: 'return {..., $K: traceback.format_exc(), ...}'
