- id: gcr-ssrf-guard-misses-shared-range-python
  languages:
  - python
  severity: WARNING
  message: This address check blocks private addresses with is_private, which is False for the
    100.64.0.0/10 shared range (carrier grade NAT). Cloud metadata services and internal hosts
    live there, so a URL that resolves to one passes the check. Accept an address only when
    is_global is True and it is neither multicast nor inside the NAT64 prefix 64:ff9b::/96,
    which is_global still calls public.
  metadata:
    cwe: 'CWE-918: Server-Side Request Forgery (SSRF)'
    category: security
    confidence: MEDIUM
  patterns:
  - pattern: $IP.is_private
  - pattern-inside: |
      def $F(...):
        ...
  - pattern-either:
    - pattern-inside: |
        def $F(...):
          ...
          $A = <... socket.getaddrinfo(...) ...>
          ...
    - pattern-inside: |
        def $F(...):
          ...
          for $I in socket.getaddrinfo(...):
            ...
          ...
    - pattern-inside: |
        def $F(...):
          ...
          $A = <... socket.gethostbyname(...) ...>
          ...
    - pattern-inside: |
        def $F(...):
          ...
          $A = <... urlparse(...) ...>
          ...
    - pattern-inside: |
        def $F(...):
          ...
          $A = <... urlsplit(...) ...>
          ...
  - pattern-not-inside: |
      def $F(...):
        ...
        <... $Y.is_global ...>
        ...
- id: gcr-ssrf-guard-misses-shared-range-php
  languages:
  - php
  severity: WARNING
  message: This address check relies on FILTER_FLAG_NO_PRIV_RANGE and FILTER_FLAG_NO_RES_RANGE,
    which still let the 100.64.0.0/10 shared range (carrier grade NAT) through, on PHP 8.5 too.
    Cloud metadata services and internal hosts live there, so a URL that resolves to one passes.
    Refuse 100.64.0.0/10 explicitly (and its IPv4 mapped IPv6 form) after the filter.
  metadata:
    cwe: 'CWE-918: Server-Side Request Forgery (SSRF)'
    category: security
    confidence: MEDIUM
  patterns:
  - pattern: filter_var($IP, FILTER_VALIDATE_IP, $FLAGS)
  - metavariable-regex:
      metavariable: $FLAGS
      regex: (?s).*FILTER_FLAG_NO_PRIV_RANGE.*
  - pattern-not-inside: |
      function $F(...) {
        ...
        <... '100.64.0.0/10' ...>;
        ...
      }
  - pattern-not-inside: |
      function $F(...) {
        ...
        <... "100.64.0.0/10" ...>;
        ...
      }
  - pattern-not-inside: |
      function $F(...) {
        ...
        <... '100.64.' ...>;
        ...
      }
  # The ranges kept in a class constant and checked by another method.
  - pattern-not-inside: |
      class $C {
        ...
        const $K = [..., '100.64.0.0/10', ...];
        ...
      }
  - pattern-not-inside: |
      class $C {
        ...
        const $K = [..., "100.64.0.0/10", ...];
        ...
      }
- id: gcr-proxy-trusted-from-anywhere
  languages:
  - generic
  paths:
    include:
    - '*.py'
    - '*.js'
    - '*.ts'
    - '*.mjs'
    - '*.cjs'
    - '*.conf'
    - '*.ini'
    - '*.env'
    - '*.sh'
    - '*.toml'
    - '*.yml'
    - '*.yaml'
    - 'Dockerfile'
    - '.htaccess'
  severity: WARNING
  message: The application takes the client address from X-Forwarded-For (or a like header) sent by
    anybody, not only by its own load balancer. A caller can then set any address it likes, which
    defeats per address rate limits, lockouts and allow lists, and puts false addresses in the
    audit log. Trust the forwarding header only from the load balancer's own addresses.
  metadata:
    cwe: 'CWE-348: Use of Less Trusted Source'
    category: security
    confidence: MEDIUM
  pattern-either:
  - pattern-regex: forwarded_allow_ips\s*=\s*["']\*["']
  - pattern-regex: --forwarded-allow-ips[= ]+["']?\*
  - pattern-regex: FORWARDED_ALLOW_IPS\s*[=:]\s*["']?\*
  - pattern-regex: trusted_hosts\s*=\s*["']\*["']
  - pattern-regex: \.set\(\s*["']trust proxy["']\s*,\s*true\s*\)
  - pattern-regex: (?m)^\s*set_real_ip_from\s+(0\.0\.0\.0/0|::/0)\s*;
  - pattern-regex: (?m)^\s*RemoteIP(Internal|Trusted)Proxy\s+.*\b(0\.0\.0\.0/0|::/0)\b
