    - pattern: '[..., ip_network("::1/128"), ...]'
    - pattern: '[..., ipaddress.ip_network("::1"), ...]'
    - pattern: '[..., ip_network("::1"), ...]'
    - pattern: '(..., ipaddress.ip_network("::1/128"), ...)'
    - pattern: '(..., ip_network("::1/128"), ...)'
