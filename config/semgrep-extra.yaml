# ---- Reasoning classes a pattern can decide on its own ------------------------
#
# The AI code reasoning pass asks a model about access control because a
# signature cannot see a check that is missing.  Some of what it was asked
# about can be seen without a model: a signature switched off, a secret
# compared the slow way, a request body poured into a model, a model's answer
# handed to a shell.  These rules catch those for free on every scan, so the
# model's budget goes on what only reasoning can find.

