- id: gcr-ip-blocklist-misses-unspecified
  languages:
  - python
  severity: WARNING
  message: >-
    This address blocklist has IPv6 loopback (::1) but not the unspecified address (::). On Linux
    a connection to :: lands on this host, so a URL or a redirect to http://[::]:port/ reaches local
    services the list was meant to keep out. Refuse by property rather than by list, for example
    "not ip.is_global or ip.is_unspecified or ip.is_reserved", and unwrap IPv4 mapped, 6to4 and NAT64
    forms first.
