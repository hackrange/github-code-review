  message: HTML is built by joining a field of an object straight into a string that goes into the
    page, with nothing escaping it. Fields like these usually come from the server, and if this one
    holds text a user typed (a name, a title, a description), that text runs as script in the browser
    of whoever views it. Set textContent, build the elements with createElement, or escape the value
